[project]
name = "evm-analysis"
version = "0.1.0"
description = "Fork-aware EVM bytecode tokenizer, CFG builder and feature extractor for CyberStratum"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evm_analysis"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "evm_analysis/data"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM"]
ignore = ["S101", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
